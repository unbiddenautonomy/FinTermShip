<title>fintermship glossary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@300&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a reference book. Laptop: an area index on the left, the entries on the right.
   Phone: one column under a sticky search bar. Colours are the app's Light and Dark themes. */
:root {
  --bg: #f6f4ee; --surface: #fffefa; --sunken: #eeebe2; --line: #e0dbce;
  --ink: #14221c; --ink-2: #3a463f; --ink-3: #626a60;
  --brand: #184e39; --brand-ink: #16503a; --brand-soft: #e6eee8;
  --copper: #8e5228; --copper-soft: #f7ece1; --mark: #f3e2b8;
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --word: 'Outfit', var(--body);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1410; --surface: #121f19; --sunken: #182821; --line: #283a31;
  --ink: #eeeae0; --ink-2: #d0d2c7; --ink-3: #8c988e;
  --brand: #287052; --brand-ink: #deac7e; --brand-soft: #183227;
  --copper: #deac7e; --copper-soft: #2a2118; --mark: #4a3a1a; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0b1410; --surface: #121f19; --sunken: #182821; --line: #283a31;
  --ink: #eeeae0; --ink-2: #d0d2c7; --ink-3: #8c988e;
  --brand: #287052; --brand-ink: #deac7e; --brand-soft: #183227;
  --copper: #deac7e; --copper-soft: #2a2118; --mark: #4a3a1a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 78rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { padding-block: 2rem 1rem; }
.word { font: 300 1rem var(--word); color: var(--brand-ink); letter-spacing: .02em; }
h1 { font: 600 clamp(1.9rem, 4vw, 2.6rem)/1.1 var(--display); margin: .2rem 0 .5rem; text-wrap: balance; }
.lede { color: var(--ink-3); margin: 0; max-width: 60ch; }
.lede b { font-family: var(--mono); font-weight: 500; color: var(--ink-2); }

.bar { position: sticky; padding-top: .5rem; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: .6rem; border-bottom: 1px solid var(--line); }
.bar-in { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.search { flex: 1 1 100%; min-width: 0; display: flex; align-items: center; gap: .5rem; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .55rem .85rem; }
.search:focus-within { border-color: var(--brand); }
.search svg { flex: none; color: var(--ink-3); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; font: 500 1rem var(--body); color: var(--ink); outline: none; }
@media (min-width: 640px) { .search { flex-basis: 18rem; } }
select { flex: 1 1 0; min-width: 0; font: 600 .9rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .6rem .7rem; max-width: 100%; }
.count { font: 500 .8rem var(--mono); color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.layout { display: grid; gap: 2.5rem; padding-block: 1.5rem 4rem; }
@media (min-width: 960px) { .layout { grid-template-columns: 15rem minmax(0, 1fr); } .bar select { display: none; } }
nav.index { display: none; }
@media (min-width: 960px) { nav.index { display: block; position: sticky; top: 5rem; align-self: start; max-height: calc(100vh - 6rem); overflow-y: auto; } }
nav.index a { display: grid; grid-template-columns: .5rem 1fr auto; gap: .6rem; align-items: center; padding: .35rem .5rem; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-size: .88rem; font-weight: 600; }
nav.index a:hover { background: var(--sunken); }
nav.index a[aria-current="true"] { background: var(--brand-soft); color: var(--ink); }
nav.index i { width: .5rem; height: .5rem; border-radius: 50%; }
nav.index span:last-child { font: 500 .75rem var(--mono); color: var(--ink-3); }
nav.index .lbl { font-size: .7rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 0 .5rem .5rem; }

main { min-width: 0; }
.area { margin-bottom: 3rem; scroll-margin-top: 5rem; }
.area > h2 { display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap; font: 600 1.6rem/1.2 var(--display); margin: 0 0 .25rem; padding-top: .9rem; border-top: 4px solid var(--c); text-wrap: balance; }
.area > h2 small { font: 500 .8rem var(--mono); color: var(--ink-3); }
.tag { font: 800 .65rem var(--body); letter-spacing: .1em; text-transform: uppercase; padding: .15rem .45rem; border-radius: 5px; background: var(--copper-soft); color: var(--copper); vertical-align: middle; }
.unit { font: 800 .72rem var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--copper); margin: 1.8rem 0 .2rem; }

article { padding-block: 1.1rem; border-bottom: 1px solid var(--line); scroll-margin-top: 5rem; }
article:target { background: var(--brand-soft); box-shadow: 0 0 0 .6rem var(--brand-soft); border-radius: 2px; }
.head { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
h3 { font: 600 1.2rem/1.3 var(--display); margin: 0; }
.aka { font-size: .85rem; color: var(--ink-3); }
.where { flex-basis: 100%; font-size: .75rem; font-weight: 700; color: var(--ink-3); display: inline-flex; align-items: center; gap: .4rem; }
.where i { width: .45rem; height: .45rem; border-radius: 50%; }
.short { font-weight: 700; color: var(--brand-ink); margin: .15rem 0 .35rem; }
.def { margin: 0; max-width: 68ch; color: var(--ink-2); }
.formula { font: 500 .85rem/1.5 var(--mono); background: var(--sunken); border-radius: 8px; padding: .5rem .75rem; margin: .6rem 0 0; overflow-x: auto; white-space: pre-wrap; max-width: 68ch; }
.reads { display: grid; gap: .35rem; margin: .6rem 0 0; max-width: 68ch; font-size: .9rem; color: var(--ink-2); }
.reads b { font-weight: 800; color: var(--ink); }
.note { margin: .6rem 0 0; max-width: 68ch; font-size: .9rem; color: var(--ink-2); padding-left: .75rem; border-left: 2px solid var(--copper); }
details { margin-top: .6rem; max-width: 68ch; }
summary { cursor: pointer; font-size: .85rem; font-weight: 700; color: var(--ink-3); width: max-content; max-width: 100%; }
summary:hover { color: var(--ink); }
details ul { margin: .4rem 0 0; padding-left: 1.1rem; font-size: .9rem; color: var(--ink-2); }
details li + li { margin-top: .3rem; }
.meta { margin: .55rem 0 0; font-size: .8rem; color: var(--ink-3); display: flex; gap: .3rem .9rem; flex-wrap: wrap; }
.meta a { color: var(--brand-ink); }
.see a { color: var(--ink-2); text-decoration-color: var(--line); text-underline-offset: 3px; }
.see a:hover { color: var(--brand-ink); }
mark { background: var(--mark); color: inherit; border-radius: 2px; }
.empty { color: var(--ink-3); padding: 3rem 0; text-align: center; }
.loading { color: var(--ink-3); padding: 3rem 0; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<header class="wrap">
  <div class="word">fintermship</div>
  <h1>Glossary</h1>
  <p class="lede" id="lede">Every term in the syllabus with its explanation, in the order the app teaches them.</p>
</header>

<div class="bar">
  <div class="wrap bar-in">
    <label class="search" for="q">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search terms and explanations" autocomplete="off" aria-label="Search terms and explanations">
    </label>
    <select id="area" aria-label="Area"><option value="">All areas</option></select>
    <span class="count" id="count"></span>
  </div>
</div>

<div class="wrap layout">
  <nav class="index" aria-label="Areas"><p class="lbl">Areas</p><div id="index"></div></nav>
  <main id="list"><p class="loading">Loading the glossary…</p></main>
</div>

<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  let data;
  try {
    data = await (await fetch('glossary.json')).json();
  } catch {
    $('list').innerHTML = '<p class="empty">The glossary could not load. Refresh the page to try again.</p>';
    return;
  }
  const { areas, terms } = data;
  const area = Object.fromEntries(areas.map((a) => [a.id, a]));
  const idOf = new Map(terms.map((t) => [t.term.toLowerCase(), t.id]));
  $('lede').innerHTML = `Every term in the syllabus with its explanation: <b>${terms.length}</b> terms in <b>${areas.length}</b> areas, in the order the app teaches them.`;
  $('area').insertAdjacentHTML('beforeend', areas.map((a) => `<option value="${a.id}">${esc(a.name)} (${a.count})</option>`).join(''));
  $('index').innerHTML = areas.map((a) => `<a href="#area-${a.id}" data-a="${a.id}"><i style="background:${a.colour}"></i><span>${esc(a.name)}</span><span>${a.count}</span></a>`).join('');
  for (const t of terms) t.hay = [t.term, ...(t.aliases || []), t.short, t.definition, t.note || '', t.formula || ''].join(' \u0001 ').toLowerCase();

  const hl = (s, q) => {
    const e = esc(s);
    if (!q) return e;
    const i = e.toLowerCase().indexOf(esc(q));
    return i < 0 ? e : e.slice(0, i) + '<mark>' + e.slice(i, i + esc(q).length) + '</mark>' + e.slice(i + esc(q).length);
  };
  const card = (t, q) => `<article id="${t.id}">
    <div class="head"><h3>${hl(t.term, q)}</h3>${t.aliases ? `<span class="aka">also ${hl(t.aliases.join(', '), q)}</span>` : ''}${q ? `<span class="where"><i style="background:${area[t.area].colour}"></i>${esc(area[t.area].name)} · ${esc(t.unit)}</span>` : ''}</div>
    <p class="short">${hl(t.short, q)}</p>
    <p class="def">${hl(t.definition, q)}</p>
    ${t.formula ? `<p class="formula">${hl(t.formula, q)}</p>` : ''}
    ${t.reads ? `<div class="reads"><span><b>Rising:</b> ${esc(t.reads.up)}</span><span><b>Falling:</b> ${esc(t.reads.down)}</span></div>` : ''}
    ${t.note ? `<p class="note">${hl(t.note, q)}</p>` : ''}
    ${t.examples ? `<details><summary>How it's used (${t.examples.length})</summary><ul>${t.examples.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></details>` : ''}
    ${t.see || t.asOf ? `<p class="meta">${t.see ? `<span class="see">Don't confuse with ${t.see.map((s) => idOf.has(s.toLowerCase()) ? `<a href="#${idOf.get(s.toLowerCase())}">${esc(s)}</a>` : esc(s)).join(', ')}</span>` : ''}${t.asOf ? `<span>Figures as of ${esc(t.asOf)}${t.source ? `, <a href="${esc(t.source)}" target="_blank" rel="noopener">source</a>` : ''}</span>` : ''}</p>` : ''}
  </article>`;

  const render = () => {
    const q = $('q').value.trim().toLowerCase();
    const a = $('area').value;
    const shown = terms.filter((t) => (!a || t.area === a) && (!q || t.hay.includes(q)));
    if (q) shown.sort((x, y) => rank(x, q) - rank(y, q));
    let html = '', cur = '', unit = '';
    if (q) {
      // Search results are one list, best name matches first, each labelled with its area.
      html = shown.map((t) => card(t, q)).join('');
    } else {
      for (const t of shown) {
        if (t.area !== cur) {
          if (cur) html += '</section>';
          const ar = area[(cur = t.area)];
          unit = '';
          html += `<section class="area" id="area-${ar.id}" style="--c:${ar.colour}"><h2>${esc(ar.name)} <small>${ar.count} terms</small>${ar.phase3 ? '<span class="tag">Phase 3</span>' : ''}</h2>`;
        }
        if (t.unit !== unit) html += `<p class="unit">${esc((unit = t.unit))}</p>`;
        html += card(t, q);
      }
      if (cur) html += '</section>';
    }
    $('list').innerHTML = html || `<p class="empty">No terms match “${esc(q)}”. Try fewer letters, or another spelling.</p>`;
    $('count').textContent = shown.length === terms.length ? `${terms.length} terms` : `${shown.length} of ${terms.length}`;
  };
  // Matches on the name come first, then the short line, then the rest; area order is kept within each.
  const rank = (t, q) => {
    const names = [t.term, ...(t.aliases || [])].map((s) => s.toLowerCase());
    const r = names.some((n) => n === q) ? 0 : names.some((n) => n.startsWith(q)) ? 1 : names.some((n) => n.includes(q)) ? 2 : t.short.toLowerCase().includes(q) ? 3 : 4;
    return r * 100 + areas.findIndex((x) => x.id === t.area);
  };
  const _render = render;
  let timer;
  $('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(_render, 120); });
  $('area').addEventListener('change', () => { _render(); scrollTo({ top: 0 }); });
  $('index').addEventListener('click', (e) => {
    const l = e.target.closest('a');
    if (!l) return;
    if ($('q').value) { $('q').value = ''; _render(); }
    for (const x of $('index').querySelectorAll('a')) x.setAttribute('aria-current', String(x === l));
  });
  // A "don't confuse with" link opens its term even when a search or area filter hides it.
  $('list').addEventListener('click', (e) => {
    const l = e.target.closest('.see a');
    if (!l) return;
    const id = l.getAttribute('href').slice(1);
    if (!document.getElementById(id) || $('q').value || $('area').value) {
      e.preventDefault();
      $('q').value = ''; $('area').value = ''; _render();
      document.getElementById(id)?.scrollIntoView({ block: 'start' });
      location.hash = id;
    }
  });
  _render();
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView({ block: 'start' });
})();
</script>
